# mail.ink2insight.com (+ autoconfig/MTA-STS names) -> Stalwart web (container 443 on 127.0.0.1:8443)
# These hostnames are DNS-only (grey cloud) in Cloudflare; cert comes from certbot.

server {
    listen 80;
    server_name mail.ink2insight.com mta-sts.ink2insight.com autoconfig.ink2insight.com
                autodiscover.ink2insight.com ua-auto-config.ink2insight.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name mail.ink2insight.com mta-sts.ink2insight.com autoconfig.ink2insight.com
                autodiscover.ink2insight.com ua-auto-config.ink2insight.com;

    ssl_certificate     /etc/letsencrypt/live/mail.ink2insight.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mail.ink2insight.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 50m;

    location / {
        proxy_pass https://127.0.0.1:8443;
        proxy_ssl_server_name on;
        proxy_ssl_name $host;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_read_timeout 300s;
    }
}
