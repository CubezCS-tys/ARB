# ink2insight.com -> Next.js on 127.0.0.1:3020 (behind Cloudflare proxy)

server {
    listen 80;
    server_name ink2insight.com www.ink2insight.com;
    return 301 https://ink2insight.com$request_uri;
}

server {
    listen 443 ssl http2;
    server_name www.ink2insight.com;

    ssl_certificate     /etc/ssl/cloudflare/ink2insight.com.pem;
    ssl_certificate_key /etc/ssl/cloudflare/ink2insight.com.key;

    return 301 https://ink2insight.com$request_uri;
}

server {
    listen 443 ssl http2;
    server_name ink2insight.com;

    ssl_certificate     /etc/ssl/cloudflare/ink2insight.com.pem;
    ssl_certificate_key /etc/ssl/cloudflare/ink2insight.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Mail client auto-setup (Outlook tries the bare domain first) -> Stalwart
    location ~* ^/(autodiscover/autodiscover\.xml|\.well-known/autoconfig/) {
        proxy_pass https://127.0.0.1:8443;
        proxy_ssl_server_name on;
        proxy_ssl_name mail.ink2insight.com;
        proxy_set_header Host              mail.ink2insight.com;
        # Behind Cloudflare: pass the real client IP, not the Cloudflare edge IP
        proxy_set_header X-Real-IP         $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For   $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        proxy_pass http://127.0.0.1:3020;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
    }
}
